name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag to create or retry (example: v1.2.0)'
        required: true
      target_ref:
        description: 'Git ref to release from'
        required: false
        default: 'main'

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v5

  build-release:
    needs: release-please
    if: >-
      ${{
        always() &&
        (needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch')
      }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        env:
          RELEASE_TAG_OUTPUT: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION_OUTPUT: ${{ needs.release-please.outputs.version }}
          RELEASE_SHA_OUTPUT: ${{ needs.release-please.outputs.sha }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${INPUT_VERSION_TAG}"
            TARGET_REF="${INPUT_TARGET_REF}"
            VERSION_NAME="${RELEASE_TAG#v}"
          else
            RELEASE_TAG="${RELEASE_TAG_OUTPUT}"
            TARGET_REF="${RELEASE_SHA_OUTPUT}"
            VERSION_NAME="${RELEASE_VERSION_OUTPUT}"
          fi

          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "TARGET_REF=${TARGET_REF}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Compute release metadata
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          APK_FILE_NAME="ssh-tunneling-${RELEASE_TAG}.apk"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "APK_FILE_NAME=${APK_FILE_NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"

      - name: Assemble signed release APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare release assets
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_FILE_NAME}"
          APK_SHA256=$(sha256sum "release-assets/${APK_FILE_NAME}" | cut -d ' ' -f 1)
          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > release-assets/manifest.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "tag": "${RELEASE_TAG}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILE_NAME}",
            "sha256": "${APK_SHA256}",
            "releaseNotesUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}",
            "releasedAt": "${RELEASED_AT}"
          }
          EOF

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssh-tunneling-release-apk-${{ env.RELEASE_TAG }}
          path: |
            release-assets/${{ env.APK_FILE_NAME }}
            release-assets/manifest.json
          if-no-files-found: error

      - name: Create draft release for manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_REF" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --draft
          fi

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-assets/${APK_FILE_NAME}" \
            release-assets/manifest.json \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
